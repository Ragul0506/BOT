services:
  - type: web
    name: grocery-telegram-bot
    env: python
    region: frankfurt  # or singapore
    plan: free
    buildCommand: |
      apt-get update -y && apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-tam
      pip install --no-cache-dir -r requirements.txt
      python download_fonts.py
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEETS_CREDENTIALS_JSON
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
    healthCheckPath: /
